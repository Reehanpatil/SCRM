<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>VidyaDesk – School Management Demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --tx: #14213d;
        --mut: #5b6784;
        --bd: #e2e7f1;
        --pri: #1d4ed8;
        --priTx: #fff;
        --soft: #e8efff;
        --ok: #0f7b4b;
        --okBg: #dcf5e8;
        --bad: #b42318;
        --badBg: #fde3e0;
        --warn: #9a5b00;
        --warnBg: #fff0d1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1424;
          --card: #171f35;
          --tx: #e8ecf8;
          --mut: #9aa5c4;
          --bd: #273250;
          --pri: #6b9bff;
          --priTx: #0e1424;
          --soft: #1f2c52;
          --ok: #5fd9a0;
          --okBg: #12372a;
          --bad: #ff9d94;
          --badBg: #40201d;
          --warn: #ffc561;
          --warnBg: #3d2d0e;
        }
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font-family: "Inter", sans-serif;
        margin: 0;
        font-size: 15px;
      }
      h1,
      h2,
      h3,
      .hd {
        font-family: "Poppins", sans-serif;
      }
      .material-symbols-outlined {
        font-size: 21px;
        vertical-align: middle;
        line-height: 1;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 16px;
      }
      .btn {
        background: var(--pri);
        color: var(--priTx);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
        border: 0;
        font-size: 14px;
      }
      .btn:focus-visible,
      .nav:focus-visible,
      .inp:focus-visible {
        outline: 2px solid var(--pri);
        outline-offset: 2px;
      }
      .b2 {
        background: var(--soft);
        color: var(--pri);
      }
      .bd {
        background: var(--badBg);
        color: var(--bad);
      }
      .wa {
        background: #1fa855;
        color: #fff;
      }
      .inp {
        width: 100%;
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 14px;
      }
      label {
        font-size: 13px;
        color: var(--mut);
        display: block;
        margin-bottom: 4px;
      }
      .nav {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mut);
        cursor: pointer;
        text-align: left;
        background: none;
        border: 0;
        font-size: 14px;
      }
      .nav.on {
        background: var(--soft);
        color: var(--pri);
        font-weight: 600;
      }
      .tag {
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
      }
      .ok {
        background: var(--okBg);
        color: var(--ok);
      }
      .bad {
        background: var(--badBg);
        color: var(--bad);
      }
      .warn {
        background: var(--warnBg);
        color: var(--warn);
      }
      .info {
        background: var(--soft);
        color: var(--pri);
      }
      table {
        width: 100%;
        font-size: 14px;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        color: var(--mut);
        font-weight: 500;
        padding: 8px;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid var(--bd);
        white-space: nowrap;
      }
      .sw {
        width: 42px;
        height: 24px;
        border-radius: 99px;
        background: var(--bd);
        position: relative;
        cursor: pointer;
        border: 0;
        flex: none;
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: 0.2s;
      }
      .sw.on {
        background: var(--ok);
      }
      .sw.on::after {
        left: 21px;
      }
      .btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary {
        list-style: none;
      }
      #side {
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .paper {
        background: #fff;
        color: #111;
        padding: 26px;
        border: 3px double #1d4ed8;
        max-width: 760px;
        margin: 0 auto;
        font-family: "Inter", sans-serif;
      }
      .paper table {
        color: #111;
      }
      .paper td,
      .paper th {
        border: 1px solid #ccc;
        color: #111;
      }
      @media print {
        body > :not(#doc) {
          display: none !important;
        }
        #doc {
          position: static !important;
          background: none !important;
          padding: 0 !important;
        }
        .noprint {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="login" class="min-h-screen grid md:grid-cols-2">
      <div
        class="hidden md:flex flex-col justify-center p-12"
        style="background: var(--pri); color: var(--priTx)"
      >
        <span class="material-symbols-outlined" style="font-size: 48px"
          >school</span
        >
        <h1 class="text-4xl font-bold mt-4">VidyaDesk</h1>
        <p class="mt-3 text-lg opacity-90 max-w-md">
          Admissions, fees, attendance, exams and staff HR for private schools,
          all in one place. Parents need no login. They get updates on WhatsApp.
        </p>
      </div>
      <div class="flex items-center justify-center p-5">
        <div class="w-full max-w-md">
          <h2 class="text-2xl font-bold">Demo login</h2>
          <p class="text-sm" style="color: var(--mut)">
            Pick a role and the details fill in automatically.
          </p>
          <div id="roleBtns" class="grid grid-cols-2 gap-2 my-4"></div>
          <div class="card space-y-3">
            <div>
              <label for="u">Username</label
              ><input id="u" class="inp" autocomplete="off" />
            </div>
            <div>
              <label for="p">Password</label
              ><input id="p" type="password" class="inp" />
            </div>
            <p id="err" class="text-sm hidden" style="color: var(--bad)">
              Incorrect username or password.
            </p>
            <button class="btn w-full justify-center" onclick="doLogin()">
              Log in
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="app" class="hidden">
      <header
        class="sticky top-0 z-30 flex items-center gap-3 px-4 py-3 border-b"
        style="background: var(--card); border-color: var(--bd)"
      >
        <button
          class="md:hidden"
          aria-label="Menu"
          onclick="side.classList.toggle('hidden')"
        >
          <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="hd font-semibold truncate" id="school"></span>
        <span class="tag info hidden sm:inline-block" id="roleTag"></span>
        <button class="ml-auto btn b2" onclick="logout()">

          ><span class="hidden sm:inline">Log out</span>
        </button>
      </header>
      <div class="md:flex">
        <aside
          id="side"
          class="hidden md:block md:w-64 p-3 border-r fixed md:sticky top-14 z-20 w-64 h-[calc(100vh-56px)] overflow-y-auto flex-none"
          style="background: var(--card); border-color: var(--bd)"
        >
          <nav id="nav" class="space-y-0.5"></nav>
        </aside>
        <main id="main" class="flex-1 p-4 md:p-6 min-w-0 max-w-6xl"></main>
      </div>
    </div>

                ". Everyone is present by default, tap to mark absent",
            ) +
            `<div class="card"><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">${L.map((s) => `<button class="flex items-center justify-between rounded-xl p-3 border" style="border-color:var(--bd);background:${ABS.has(s.no) ? "var(--badBg)" : "var(--okBg)"};color:var(--tx)" onclick="tg('${s.no}')"><span>${s.n}</span><b style="color:${ABS.has(s.no) ? "var(--bad)" : "var(--ok)"}">${ABS.has(s.no) ? "Absent" : "Present"}</b></button>`).join("")}</div><div class="mt-4 flex flex-wrap gap-2 items-center"><span>Present ${L.length - ab} | Absent ${ab}</span>${btn("Save", "save", "toast('Attendance saved')")}${waB("Send monthly attendance", `Dear Parent, attendance update for this month from the class teacher. - ${myT().n}, ${c}, ${S.name}`)}</div></div>`
          );
        },
        pend: () => {
          const c = myCls();
          if (role == "teacher" && !c)
            return (
              T("Fees due", "") +
              note("Only the class teacher sees the fees due list of a class.")
            );
          return (
            T(
              role == "teacher" ? "Fees due (" + c + ")" : "Pending fees",
              "Largest dues first. Filter by class",
            ) +
            dt(
              "pend",
              ["Student", "Class", "Due", "Reminder"],
              () =>
                act()
                  .filter((s) => s.due > 0 && (role != "teacher" || s.c == c))
                  .sort((a, b) => b.due - a.due)
                  .map((s) =>
                    rw(
                      [
                        s.n,
                        s.c,
                        tag(money(s.due), "bad"),
                        waB(
                          "WhatsApp",
                          `Dear Parent, fee of ${money(s.due)} for ${s.n} is pending. Please pay at the earliest. - ${S.name}`,
                        ),
                      ],
                      sTxt(s),
                      s.c,
                    ),
                  ),
              { cls: role == "teacher" ? 0 : 1 },
            )
          );
        },
        due: () => P.pend(),
        notes: () => {
          const A = myAsg();
          return (
            T(
              "Notes and homework",
              "Upload for one of your classes and share with parents on WhatsApp",
            ) +
            `<div class="card grid gap-3">${sx(
              "nt",
              "Class and subject",
              A.map((x) => x.c + " | " + x.s),
              0,
              "",
            )}${fld("w1", "Title", "text", "Chapter 4 homework")}${fld("w2", "File (PDF or photo)", "file")}<div class="flex gap-2 flex-wrap">${btn("Upload", "upload", "toast('Uploaded')")}${waB("Share on WhatsApp", `Homework uploaded by ${myT().n}. - ${S.name}`)}</div></div>`
          );
        },
        leave: () =>
          T("Apply for leave", "Your request goes to the Admin") +
          `<div class="card grid sm:grid-cols-2 gap-3">${sel("l1", "Leave type", ["Casual (CL)", "Sick (SL)", "Earned (EL)", "Half-day", "Unpaid"])}${fld("l2", "From", "date")}${fld("l3", "To", "date")}${fld("l4", "Reason")}<div>${btn("Submit request", "send", "leaves.unshift([myT().n,v('l1').slice(-3,-1)||'CL',v('l2')||'TBD',v('l4')||'-','warn']);toast('Leave request sent')")}</div></div>`,
        slip: () =>
          T("My salary slip", "October 2026") +
          `<div class="card">${btn("View salary slip", "receipt", `slip(${tch.indexOf(myT())})`)}</div>`,
        timetable: () => {
          if (role != "teacher") return oldTT();
          const A = myAsg();
          return (
            T("My timetable", "Built from your class and subject allocation") +
            `<div class="card overflow-x-auto"><table><tr><th>Day</th>${[1, 2, 3, 4, 5, 6].map((p) => `<th>P${p}</th>`).join("")}</tr>${[
              "Mon",
              "Tue",
              "Wed",
              "Thu",
              "Fri",
              "Sat",
            ]
              .map(
                (d, r) =>
                  `<tr><td><b>${d}</b></td>${[0, 1, 2, 3, 4, 5]
                    .map((c) => {
                      const k = (r * 6 + c * 5) % (A.length * 2 || 1),
                        a = A[k];
                      return `<td>${a && k < A.length ? a.c + '<br><span style="color:var(--mut)">' + a.s + "</span>" : "Free"}</td>`;
                    })
                    .join("")}</tr>`,
              )
              .join("")}</table></div>`
          );
        },
        search: () =>
          selStu !== null ?
            recHtml(selStu)
          : T(
              "Student records",
              role == "teacher" ?
                "Students of your own classes. Open a student to see the complete record"
              : "Search any detail: name, admission number, mobile, parent, address, class or previous school",
            ) +
            dt(
              "srch",
              [
                "Adm no.",
                "Name",
                "Class",
                "Father",
                "Mobile",
                "Admitted",
                "Status",
                "",
              ],
              () =>
                stu
                  .map((s, i) => ({ s, i }))
                  .filter(
                    (x) => role != "teacher" || myClasses().includes(x.s.c),
                  )
                  .map(({ s, i }) =>
                    rw(
                      [
                        s.no,
                        s.n,
                        s.c,
                        s.f,
                        s.mob,
                        s.adm,
                        stClr(s),
                        btn(
                          "Open full record",
                          "folder_shared",
                          `openRec(${i})`,
                        ),
                      ],
                      sTxt(s),
                      s.c,
                      stF(s),
                    ),
                  ),
              {
                cls: 1,
                f2: STAT,
                ph: "Name, ID, mobile, parent, address, class...",
              },
            ),
      });
      function doLogin() {
        const x = USERS.find((k) => k.u == v("u").trim() && k.p == v("p"));
        if (!x || !x.on) {
          $("err").textContent =
            x ?
              "This login has been disabled by the Admin."
            : "Incorrect username or password.";
          $("err").classList.remove("hidden");
          return;
        }
        ME = x;
        role = x.r;
        selStu = null;
        $("err").classList.add("hidden");
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("roleTag").textContent = R[role].n + ": " + x.n;
        $("school").textContent =
          role == "root" ? "VidyaDesk Control Panel" : S.name;
        buildNav();
        go("dash");
      }
      $("roleBtns").innerHTML = [
        ["admin", "Admin (Principal)"],
        ["clerk", "Clerk / Sub Admin"],
        ["teacher", "Teacher: Mrs. Rekha (class teacher)"],
        ["anil", "Teacher: Mr. Anil (subject teacher)"],
      ]
        .map((a) => {
          const x = USERS.find((k) => k.u == a[0]);
          return `<button class="btn b2 justify-center text-center" onclick="u.value='${x.u}';p.value='${x.p}'">${a[1]}</button>`;
        })
        .join("");
      function prof(i) {
        openRec(i);
      }
      function go(p) {
        if (!navFor(role).some((n) => n[0] == p) && p != "search") {
          toast("This module is turned OFF for your role");
          return;
        }
        page = p;
        $("main").innerHTML = (P[p] || (() => T("Coming soon")))();
        document
          .querySelectorAll(".nav")
          .forEach((b) => b.classList.toggle("on", b.dataset.p == p));
        if (innerWidth < 768) side.classList.add("hidden");
        clearInterval(window.iv);
        if (p == "punch") {
          const t = () => {
            const c = $("clk");
            if (c) c.textContent = new Date().toLocaleTimeString("en-IN");
          };
          window.iv = setInterval(t, 1000);
          t();
        }
        scrollTo(0, 0);
      }
    </script>
  </body>
</html>
